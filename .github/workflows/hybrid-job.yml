name: Create hybrid jobs
on: 
  workflow_dispatch
jobs:
  hybrid_job:
    runs-on: ubuntu-latest # (partiellement visible en haut, non affiché entièrement sur l'image)
    steps:
      - name: Run inside an Alpine container
        uses: docker://alpine:3.14 # The image must be accessible without authentication
        with:
          entrypoint: /bin/sh
          args: |
            -c "echo 'This step runs inside an Alpine container'"

      - name: Run another command in Ubuntu VM
        run: echo "Back to the VM"

  dockerized_job:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a Node.js container"
